<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1C2140">
<title>Mazmorra – mando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Grenze+Gotisch:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/comun.css?v=25">
<link rel="stylesheet" href="css/mando.css?v=25">
<!-- Cada módulo con el número de versión (lo pone el hook): así el navegador no mezcla ficheros guardados
     de versiones distintas. Al añadir un módulo, añádelo aquí y en host.html. -->
<script type="importmap">
{
  "imports": {
    "./js/comun/almacen.js": "./js/comun/almacen.js?v=25",
    "./js/comun/diagnostico.js": "./js/comun/diagnostico.js?v=25",
    "./js/comun/pantalla.js": "./js/comun/pantalla.js?v=25",
    "./js/red/protocolo.js": "./js/red/protocolo.js?v=25",
    "./js/red/ice.js": "./js/red/ice.js?v=25",
    "./js/red/sala.js": "./js/red/sala.js?v=25",
    "./js/red/cliente.js": "./js/red/cliente.js?v=25",
    "./js/motor/partida.js": "./js/motor/partida.js?v=25",
    "./js/tablero/dibujo.js": "./js/tablero/dibujo.js?v=25",
    "./js/tablero/registro.js": "./js/tablero/registro.js?v=25",
    "./js/tablero/main.js": "./js/tablero/main.js?v=25",
    "./js/mando/main.js": "./js/mando/main.js?v=25"
  }
}
</script>
</head>
<body>
  <h1>Mazmorra</h1>

  <form id="entrada">
    <label>Tu nombre
      <input id="nombre" maxlength="16" autocomplete="off" required>
    </label>
    <label>Código de sala
      <input id="codigo" maxlength="4" autocomplete="off" required>
    </label>
    <button class="principal" type="submit">Entrar en la sala</button>
  </form>

  <div id="cruceta" class="oculto">
    <button class="arriba" data-dx="0" data-dy="-1" aria-label="Arriba">▲</button>
    <button class="izq" data-dx="-1" data-dy="0" aria-label="Izquierda">◀</button>
    <div id="ficha"></div>
    <button class="der" data-dx="1" data-dy="0" aria-label="Derecha">▶</button>
    <button class="abajo" data-dx="0" data-dy="1" aria-label="Abajo">▼</button>
  </div>

  <p id="avisoPantalla" class="oculto">Toca la pantalla para que no se apague</p>
  <p id="datos" class="oculto solo-diag"></p>
  <p id="estado"></p>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="js/mando/main.js?v=25"></script>
<script nomodule>document.getElementById('estado').textContent = 'Este navegador es demasiado antiguo para el mando.';</script>
<script src="../version.js?v=25"></script>
</body>
</html>
