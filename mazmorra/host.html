<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mazmorra – tablero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Grenze+Gotisch:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/comun.css?v=26">
<link rel="stylesheet" href="css/tablero.css?v=26">
<!-- Cada módulo con el número de versión (lo pone el hook): así el navegador no mezcla ficheros guardados
     de versiones distintas. Al añadir un módulo, añádelo aquí y en mando.html. -->
<script type="importmap">
{
  "imports": {
    "./js/comun/almacen.js": "./js/comun/almacen.js?v=26",
    "./js/comun/diagnostico.js": "./js/comun/diagnostico.js?v=26",
    "./js/comun/pantalla.js": "./js/comun/pantalla.js?v=26",
    "./js/red/protocolo.js": "./js/red/protocolo.js?v=26",
    "./js/red/ice.js": "./js/red/ice.js?v=26",
    "./js/red/sala.js": "./js/red/sala.js?v=26",
    "./js/red/cliente.js": "./js/red/cliente.js?v=26",
    "./js/motor/partida.js": "./js/motor/partida.js?v=26",
    "./js/tablero/dibujo.js": "./js/tablero/dibujo.js?v=26",
    "./js/tablero/registro.js": "./js/tablero/registro.js?v=26",
    "./js/tablero/main.js": "./js/tablero/main.js?v=26",
    "./js/mando/main.js": "./js/mando/main.js?v=26"
  }
}
</script>
</head>
<body>
  <div id="zona"><div id="tablero"></div></div>
  <aside>
    <h1>Mazmorra</h1>
    <div>
      <p class="ayuda">Código de sala</p>
      <div id="codigo">····</div>
    </div>
    <div id="qr"></div>
    <p class="ayuda" id="ayudaQr">Escanea el código con el móvil para unirte.</p>
    <div id="url"></div>
    <ul id="lista"></ul>
    <p class="ayuda" id="pantalla"></p>
    <p class="ayuda solo-diag" id="medidas"></p>
    <button id="verRegistro" class="solo-diag" type="button">Ver registro completo</button>
    <div id="log" class="solo-diag" title="Pulsa para ver el registro completo"></div>
  </aside>
  <div id="registro" class="oculto">
    <h2>Registro de eventos</h2>
    <p class="ayuda">Los 50 más recientes, el último arriba. Pulsa en cualquier sitio para cerrar.</p>
    <div id="logCompleto"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="js/tablero/main.js?v=26"></script>
<script nomodule>document.getElementById('ayudaQr').textContent = 'Este navegador es demasiado antiguo para el tablero.';</script>
<script src="../version.js?v=26"></script>
</body>
</html>
